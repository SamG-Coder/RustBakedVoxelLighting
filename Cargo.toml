[workspace]
members = ["crates/engine", "crates/woodland"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
ash = "0.38"
ash-window = "0.13"
winit = "0.30"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.dev]
opt-level = 3
[profile.dev.package."*"]
opt-level = 3
[profile.release]
lto = "thin"
codegen-units = 8
