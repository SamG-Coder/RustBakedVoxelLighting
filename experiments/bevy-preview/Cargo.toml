[workspace]
members = ["crates/engine", "crates/woodland"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["3d", "ui", "default_font", "png", "multi_threaded", "tonemapping_luts", "zstd_rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.release]
lto = "thin"
codegen-units = 8
